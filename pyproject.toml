[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "islam-research-workbench"
version = "0.1.0"
description = "Local-first tools for traceable literature research and knowledge graphs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
graph = ["rdflib>=7,<8", "pyshacl>=0.25,<1"]
database = [
    "psycopg[binary]==3.3.6",
]
api = [
    "fastapi==0.143.2",
    "pyjwt[crypto]==2.15.1",
    "uvicorn==0.54.0",
    "jsonschema==4.26.0",
]
test = [
    "httpx==0.28.1",
]
semantic = [
    "jsonschema==4.26.0",
]

[project.scripts]
islam-research = "islam_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
islam_research = ["migrations/*.sql", "policies/*.json"]
