[package]
name = "atlas-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
rfd = { version = "=0.16.1", default-features = false }
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
libc = "=0.2.191"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-review = []

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
