name: Reading workspace

on:
  workflow_call:
  pull_request:
    paths: ['web/**', 'runtime/**', 'src/**', 'scripts/build_public_site.py', 'scripts/test_public_site.py', 'config/public-build.json', 'semantic/**', 'pyproject.toml', 'uv.lock', '.github/workflows/workspace-validation.yml']
  push:
    branches: [main]
    paths: ['web/**', 'runtime/**', 'src/**', 'scripts/build_public_site.py', 'scripts/test_public_site.py', 'config/public-build.json', 'semantic/**', 'pyproject.toml', 'uv.lock', '.github/workflows/workspace-validation.yml']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node scripts/review-connected-workspace.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/review-workspace.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/review-quran-reader.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/review-gutenberg.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/review-source-intake.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/review-pilot-reader.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/review-verse-links.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/review-notebook.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/review-margin-writing.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/review-working-cache.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/review-research-tools.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/review-recoverable-drafts.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.9.21'
      - run: uv sync --frozen --extra semantic
        working-directory: .
      - run: uv run --no-sync python scripts/test_public_site.py
        working-directory: .
        env:
          CHROME_PATH: /usr/bin/google-chrome
