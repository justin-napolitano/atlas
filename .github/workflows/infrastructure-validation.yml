name: GCP infrastructure validation

on:
  workflow_call:
  pull_request:
    paths: ['infra/**', 'config/postgres-observability.json', '.github/workflows/infrastructure-validation.yml']
  push:
    branches: [main]
    paths: ['infra/**', 'config/postgres-observability.json', '.github/workflows/infrastructure-validation.yml']

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate -no-color
      - run: terraform test -no-color
  iac-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.9.21'
      - run: python infra/tools/validate_logging_policy.py
      - run: uv sync --project infra/tools --frozen
      - run: uv run --project infra/tools --no-sync python -m unittest discover -s infra/tools -p test_public_runtime_check.py -v
      - run: uv run --project infra/tools --no-sync python -m unittest discover -s infra/tools -p test_owner_runtime_check.py -v
      - run: mkdir -p research-library/security
      - run: uv run --project infra/tools --no-sync checkov --directory infra/gcp --framework terraform --external-checks-dir infra/checks --output json > research-library/security/checkov.json
      - run: python infra/tools/validate_public_check_evidence.py research-library/security/checkov.json
        if: ${{ always() }}
      - run: python infra/tools/validate_owner_check_evidence.py research-library/security/checkov.json
        if: ${{ always() }}
      - name: Retain source-only Terraform policy evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-v2-security-evidence
          path: research-library/security/checkov.json
          retention-days: 14
          if-no-files-found: warn
