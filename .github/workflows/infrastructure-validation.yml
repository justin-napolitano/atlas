name: GCP infrastructure validation

on:
  workflow_call:
  pull_request:
    paths: ['infra/**', 'config/postgres-observability.json', '.github/workflows/infrastructure-validation.yml']
  push:
    branches: [main]
    paths: ['infra/**', 'config/postgres-observability.json', '.github/workflows/infrastructure-validation.yml']

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate -no-color
      - run: terraform test -no-color
  iac-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.9.21'
      - run: python infra/tools/validate_logging_policy.py
      - run: uv sync --project infra/tools --frozen
      - run: uv run --project infra/tools --no-sync checkov --directory infra/gcp --framework terraform --compact
