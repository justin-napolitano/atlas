name: PostgreSQL contracts

on:
  workflow_call:
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/export_api_schema.py', 'scripts/validate_semantic.py', 'scripts/check_postgres_logging.py', 'config/postgres-observability.json', 'semantic/**', 'docs/api-contracts/**', 'pyproject.toml', 'uv.lock', '.github/workflows/postgres-validation.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/export_api_schema.py', 'scripts/validate_semantic.py', 'scripts/check_postgres_logging.py', 'config/postgres-observability.json', 'semantic/**', 'docs/api-contracts/**', 'pyproject.toml', 'uv.lock', '.github/workflows/postgres-validation.yml']

permissions:
  contents: read

jobs:
  integration:
    name: PostgreSQL ${{ matrix.major }} contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: '17'
            image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
          - major: '18'
            image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: research_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d research_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Isolated ephemeral CI service, never a production credential.
      RESEARCH_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/research_test
      RESEARCH_LOGGING_PROBE_ALLOW_CONFIGURE: isolated-ci-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.9.21'
      - run: uv sync --frozen --extra database --extra graph --extra api --extra test --extra semantic
      - run: uv run --no-sync python scripts/check_postgres_logging.py configure
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python scripts/export_api_schema.py --check
      - run: uv run --no-sync python scripts/validate_semantic.py
      - run: uv run --no-sync islam-research validate
      - run: uv run --no-sync python scripts/check_postgres_logging.py probe
      - name: Capture and verify isolated database logs
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          sleep 1
          docker logs "$POSTGRES_SERVICE_ID" > research-library/testing/logging-probe/postgres.log 2>&1
          uv run --no-sync python scripts/check_postgres_logging.py verify --log-file research-library/testing/logging-probe/postgres.log
