name: PostgreSQL contracts

on:
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/postgres-validation.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/postgres-validation.yml']

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: research_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d research_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Isolated ephemeral CI service, never a production credential.
      RESEARCH_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/research_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.9.21'
      - run: uv sync --frozen --extra database --extra graph
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync islam-research validate
