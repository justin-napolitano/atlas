name: Owner container validation
on:
  workflow_call:
  pull_request:
    paths: ['src/**', 'scripts/**', 'web/**', 'config/owner-container.json', 'pyproject.toml', 'uv.lock', '.github/workflows/owner-container-validation.yml']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'web/**', 'config/owner-container.json', 'pyproject.toml', 'uv.lock', '.github/workflows/owner-container-validation.yml']
permissions:
  contents: read
jobs:
  owner-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESEARCH_CONTAINER_TESTS: isolated-ci-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.9.21'
      - run: uv sync --frozen --extra api --extra database --extra test
      - run: npm ci --prefix web --no-audit --no-fund
      - run: uv run --no-sync python -m unittest discover -s tests -p test_owner_runtime.py -v
      - run: uv run --no-sync python scripts/check_owner_container.py
      - name: Retain synthetic owner image evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-owner-container-evidence
          path: research-library/owner-container-validation/
          if-no-files-found: warn
          retention-days: 14
