name: Embedded SQLite contracts

on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/sqlite-validation.yml']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/sqlite-validation.yml']

permissions:
  contents: read

jobs:
  embedded-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.9.21'
      - run: uv sync --frozen --extra api --extra database --extra test --extra desktop-sqlite
      - run: uv run --no-sync python scripts/generate_sqlite_schema.py --check
      - run: uv run --no-sync python -m unittest discover -s tests -p 'test_sqlite*.py' -v
