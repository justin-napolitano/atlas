name: Graph validation

on:
  push:
    paths:
      - "graph/**"
      - "src/islam_research/**"
      - "pyproject.toml"
      - ".github/workflows/graph-validation.yml"
  pull_request:
    paths:
      - "graph/**"
      - "src/islam_research/**"
      - "pyproject.toml"
      - ".github/workflows/graph-validation.yml"

jobs:
  shacl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[graph]"
      - run: islam-research validate
      - run: islam-research export --output-dir research-library/exports
      - run: islam-research export --output-dir research-library/exports --check
