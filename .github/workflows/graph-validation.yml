name: Graph validation

on:
  workflow_call:
  push:
    paths:
      - "graph/**"
      - "src/islam_research/**"
      - "pyproject.toml"
      - ".github/workflows/graph-validation.yml"
  pull_request:
    paths:
      - "graph/**"
      - "src/islam_research/**"
      - "pyproject.toml"
      - ".github/workflows/graph-validation.yml"

permissions:
  contents: read

jobs:
  shacl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[graph]"
      - run: islam-research validate
      - run: islam-research export --output-dir research-library/exports
      - run: islam-research export --output-dir research-library/exports --check
