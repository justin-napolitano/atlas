name: Desktop boundaries

on:
  pull_request:
    paths: ['desktop/**', 'scripts/*desktop*', 'scripts/local_workspace.py', 'tests/test_desktop_storage.py', 'pyproject.toml', 'uv.lock', '.github/workflows/desktop-validation.yml']
  push:
    branches: [main]
    paths: ['desktop/**', 'scripts/*desktop*', 'scripts/local_workspace.py', 'tests/test_desktop_storage.py', 'pyproject.toml', 'uv.lock', '.github/workflows/desktop-validation.yml']

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm audit
  storage-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.9.21'
      - run: uv sync --frozen --extra api --extra database --extra test
      - run: uv run --no-sync python -m unittest tests.test_desktop_storage tests.test_local_owner tests.test_owner_runtime
